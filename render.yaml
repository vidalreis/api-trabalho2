services:
  - type: web
    name: finode-api
    env: node
    region: ohio
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: DATABASE_URL
        value: file:./prod.db
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
    disk:
      name: finode-data
      mountPath: /opt/render/project/src
      sizeGB: 1
